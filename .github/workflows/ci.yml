name: ci

on:
  push:
    branches:
      - 'feat-ci/*'

jobs:
  win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        shell: pwsh
        run: |
          $missing = @()
          foreach ($tool in @("clang-cl", "cmake")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              $missing += $tool
            }
          }
          if ($missing.Count -gt 0) {
            choco install llvm cmake -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          }
          clang-cl --version
          cmake --version
      - name: Build
        shell: pwsh
        run: .\.xeofoundry\scripts\build.ps1 -PlatformTarget win-x64 -Clean
      - name: Smoke test
        shell: pwsh
        working-directory: .xeofoundry/build/win-x64
        run: ..\..\scripts\test\smoke.ps1 -FixtureFolder ..\..\..\Converter\libs\laszip\example
      - name: Collect release files
        shell: pwsh
        run: .\.xeofoundry\scripts\collect.ps1 -PlatformTarget win-x64 -Clean
      - name: Archive release
        shell: pwsh
        run: .\.xeofoundry\scripts\archive.ps1 -PlatformTarget win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: .xeofoundry/.release/PotreeConverter_*_win-x64.zip
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-14-dev libtbb-dev cmake python3 git
          clang++ --version
          cmake --version
          python3 --version
      - name: Build
        run: .xeofoundry/scripts/build.sh linux-x64 --clean
      - name: Smoke test
        working-directory: .xeofoundry/build/linux-x64
        run: ../../scripts/test/smoke.sh ../../../Converter/libs/laszip/example
      - name: Collect release files
        run: .xeofoundry/scripts/collect.sh linux-x64 --clean
      - name: Archive release
        run: .xeofoundry/scripts/archive.sh linux-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: .xeofoundry/.release/PotreeConverter_*_linux-x64.tar.gz
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-14-dev libtbb-dev cmake python3 git
          clang++ --version
          cmake --version
          python3 --version
      - name: Build
        run: .xeofoundry/scripts/build.sh linux-arm64 --clean
      - name: Smoke test
        working-directory: .xeofoundry/build/linux-arm64
        run: ../../scripts/test/smoke.sh ../../../Converter/libs/laszip/example
      - name: Collect release files
        run: .xeofoundry/scripts/collect.sh linux-arm64 --clean
      - name: Archive release
        run: .xeofoundry/scripts/archive.sh linux-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: .xeofoundry/.release/PotreeConverter_*_linux-arm64.tar.gz
          if-no-files-found: error
